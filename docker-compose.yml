# Yüküm: API + SQL Server tek komutla | `cp .env.example .env` (parolaları değiştir) sonra `docker compose up --build`
# API: http://localhost:5054/scalar (API deneme sayfası) | sağlık: http://localhost:5054/health

services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64 # Apple Silicon'da emülasyonla çalışır
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?.env dosyasında DB_PASSWORD tanımlı olmalı}
    volumes:
      - yukum-compose-data:/var/opt/mssql
    # Dışarıya port AÇILMAZ: yalnız API, compose ağından "db" adıyla erişir (elle açılmış yukum-sql ile 1433 çakışmaz)
    healthcheck: # SQL Server hazır olana kadar API başlamaz
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: . # depo kökü: il/ilçe verisi docs/veri/ içinde
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development # Scalar sayfası yalnız Development'ta açıktır; canlıda Production kullanılır
      ConnectionStrings__DefaultConnection: Server=db;Database=Yukum;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=True
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?.env dosyasında JWT_SIGNING_KEY tanımlı olmalı}
      Database__MigrateOnStartup: "true" # açılışta tablolar + il/ilçe verisi kurulur
    ports:
      - "${API_PORT:-5054}:8080" # iOS uygulaması yine localhost:5054'e bağlanır

volumes:
  yukum-compose-data:
