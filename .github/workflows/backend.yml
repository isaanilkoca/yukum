# Backend CI: her push ve PR'da derle + test et + Docker imajı derlenebiliyor mu bak
name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "docs/veri/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "docs/veri/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest # Docker hazır gelir: entegrasyon testleri Testcontainers ile gerçek SQL Server açar
    env:
      # 15 Kasım: her test kendi API örneğini açar; her örnek appsettings dosyalarını izlemek için Linux'ta inotify açar.
      #   Runner sınırı 128 → ~250 testten sonra "inotify limit reached" ile testler düşüyordu (Mac'te sınır yok, yerelde geçiyordu).
      #   Testte ayar dosyası değişmez → izleme kapatılır.
      DOTNET_hostBuilder__reloadConfigOnChange: "false"
    steps:
      - name: inotify sınırını yükselt (yedek önlem)
        run: sudo sysctl -w fs.inotify.max_user_instances=1024
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Derle
        run: dotnet build backend/Yukum.slnx -c Release
      - name: Test (birim + entegrasyon)
        run: dotnet test backend/Yukum.slnx -c Release --no-build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Docker imajı derlenebiliyor mu
        run: docker build -f backend/Dockerfile .
